<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop capacity — one core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #E3E7EB;
  --panel: #F6F7F8;
  --panel2: #ECEFF2;
  --ink: #17202A;
  --muted: #5E6B78;
  --line: #C6CED6;
  --line-soft: #DDE3E8;
  --steel: #2E6A97;
  --steel-soft: #D9E6F0;
  --ok: #2E8B57;
  --warn: #D49B00;
  --hot: #D2431B;
  --hot-soft: #F8DDD3;
  --idle: #98A2AC;
  --hex: #2E6A97;
  --sr: #7457B8;
  --dowel: #BF7318;
  --plug: #248F80;
  --focus: #2E6A97;
  --floor: #D8DDE2;
  --grid: #C2CAD1;
  font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  color: var(--ink);
  background: var(--bg);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181D; --panel: #1C2229; --panel2: #242C34; --ink: #E6EBF0; --muted: #98A5B2;
    --line: #333D48; --line-soft: #2A333D; --steel: #5A9BD1; --steel-soft: #23384B; --hot-soft: #4A2A22;
    --idle: #5C6771; --floor: #1E252C; --grid: #2C353F; --hex: #5A9BD1; --sr: #9C84D8; --dowel: #D9903A; --plug: #3FAE9E; --focus: #5A9BD1;
  }
}
:root[data-theme="dark"] {
  --bg: #14181D; --panel: #1C2229; --panel2: #242C34; --ink: #E6EBF0; --muted: #98A5B2;
  --line: #333D48; --line-soft: #2A333D; --steel: #5A9BD1; --steel-soft: #23384B; --hot-soft: #4A2A22;
  --idle: #5C6771; --floor: #1E252C; --grid: #2C353F; --hex: #5A9BD1; --sr: #9C84D8; --dowel: #D9903A; --plug: #3FAE9E; --focus: #5A9BD1;
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.4; font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

#app { display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
header { display: flex; align-items: center; gap: 18px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 15px; font-weight: 600; margin: 0 8px 0 0; letter-spacing: -0.01em; }
header .g { display: flex; align-items: center; gap: 6px; color: var(--muted); }
header .g strong { color: var(--ink); font-weight: 500; }
header .spacer { flex: 1; }
header .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
header .seg button { background: transparent; border: 0; padding: 4px 10px; cursor: pointer; color: var(--muted); }
header .seg button[aria-pressed="true"] { background: var(--steel); color: #fff; }
header .link { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px 6px; text-decoration: underline; text-underline-offset: 2px; }
header .link:hover { color: var(--ink); }

main { display: grid; grid-template-columns: 350px minmax(0, 1fr) 330px; min-height: 0; }
aside { overflow-y: auto; padding: 12px 14px 24px; min-height: 0; }
#controls { border-right: 1px solid var(--line); background: var(--panel); }
#results { border-left: 1px solid var(--line); background: var(--panel); }
#floor { position: relative; min-width: 0; min-height: 0; background: var(--floor); }
#floor canvas { display: block; width: 100%; height: 100%; touch-action: none; }

/* steppers, inputs */
.num { width: 58px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); text-align: right; }
.num.w4 { width: 74px; }
.num.w3 { width: 50px; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--panel); }
.step button { width: 26px; height: 26px; border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1; }
.step button:hover { background: var(--panel2); color: var(--ink); }
.step input { width: 34px; border: 0; border-left: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft); text-align: center; padding: 3px 0; background: transparent; -moz-appearance: textfield; }
.step input::-webkit-inner-spin-button, .step input::-webkit-outer-spin-button { -webkit-appearance: none; }
select { padding: 3px 4px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }

/* controls */
.sec { border-top: 1px solid var(--line); padding: 10px 0 4px; }
.sec:first-child { border-top: 0; padding-top: 2px; }
.sec > h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--muted); }
.pool { padding: 8px 8px 8px 10px; margin: 0 -8px 4px; border-left: 3px solid transparent; border-radius: 3px; }
.pool.sel { background: var(--steel-soft); }
.pool.bn { border-left-color: var(--hot); }
.pool .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.pool .head .name { font-weight: 600; }
.pool .head .util { color: var(--muted); }
.pool .head .util.hot { color: var(--hot); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 4px 0; color: var(--muted); }
.row label { display: inline-flex; align-items: center; gap: 6px; }
.row .rad { display: inline-flex; gap: 10px; }
.row .rad label { gap: 4px; }
.blk { padding: 8px 0; border-top: 1px dashed var(--line-soft); }
.blk .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.blk .head .name { font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.blk .head .name i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.blk .body { display: grid; grid-template-columns: 62px 1fr; gap: 6px 8px; margin-top: 8px; align-items: center; color: var(--muted); }
.blk .body .k { color: var(--muted); }
.blk .body .v { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.ops { display: grid; grid-template-columns: auto auto auto auto; gap: 4px 8px; align-items: center; }
.ops .opn { padding: 3px 6px; width: 62px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }
.ops .x { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 4px; }
.ops .x:hover { color: var(--hot); }
.addop { background: none; border: 1px dashed var(--line); border-radius: 3px; color: var(--muted); cursor: pointer; padding: 2px 8px; margin-top: 2px; }
.tog { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 6px; }
.note { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; }

/* results */
.hero { padding: 6px 0 12px; border-bottom: 1px solid var(--line); }
.hero .lead { color: var(--muted); margin: 0; }
.hero .big { font-size: 44px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; margin: 2px 0 6px; }
.hero .big small { font-size: 18px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.hero .bn { margin: 0; color: var(--hot); font-weight: 500; }
.hero .bn.ok { color: var(--ok); }
.rs { padding: 12px 0 6px; border-bottom: 1px solid var(--line); }
.rs:last-child { border-bottom: 0; }
.rs h3 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--muted); }
table.t { width: 100%; border-collapse: collapse; }
table.t th { text-align: right; font-weight: 500; color: var(--muted); padding: 2px 0 6px; font-size: 12.5px; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td { padding: 4px 0; border-top: 1px solid var(--line-soft); text-align: right; white-space: nowrap; }
table.t td .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; vertical-align: -1px; }
table.t td.lim { color: var(--muted); font-size: 12.5px; }
table.t tr.bn td { color: var(--hot); }
table.t tr.bn td.lim { color: var(--hot); font-weight: 500; }
.bars { display: grid; grid-template-columns: 110px 1fr 44px; gap: 6px 8px; align-items: center; }
.bars .n { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bars .n.bn { color: var(--hot); font-weight: 500; }
.bars .bar { height: 10px; background: var(--panel2); border-radius: 2px; overflow: hidden; position: relative; }
.bars .bar i { display: block; height: 100%; background: var(--steel); }
.bars .bar i.hot { background: var(--hot); }
.bars .bar i.idle { background: var(--idle); }
.bars .p { text-align: right; color: var(--muted); }
.wip { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.wip .n { color: var(--muted); }
.wip .v { text-align: right; }
.wip .none { color: var(--muted); }
.ppl { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.ppl .n { color: var(--muted); }
.ppl .v { text-align: right; }
.ppl .tot { font-weight: 600; border-top: 1px solid var(--line-soft); padding-top: 4px; }

/* floor overlays */
#tip { position: absolute; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 3px; padding: 6px 9px; font-size: 12.5px; box-shadow: 0 2px 8px rgba(0,0,0,.12); display: none; max-width: 240px; line-height: 1.35; }
#tip b { display: block; margin-bottom: 2px; }
#tip .m { color: var(--muted); }
.legend { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 4px 8px; border-radius: 3px; pointer-events: none; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.hint { position: absolute; right: 10px; top: 10px; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 4px 8px; border-radius: 3px; pointer-events: none; }
.hint.hide { display: none; }

/* tabs (mobile) */
nav.tabs { display: none; }
@media (max-width: 1000px) {
  #app { grid-template-rows: auto minmax(0, 1fr) auto; }
  header { gap: 10px 14px; padding: 8px 12px; }
  header h1 { width: 100%; margin: 0; font-size: 14px; }
  header .g { font-size: 13px; }
  main { grid-template-columns: 1fr; }
  #controls, #results { border: 0; display: none; }
  #floor { display: none; min-height: 60vh; }
  main[data-tab="setup"] #controls, main[data-tab="floor"] #floor, main[data-tab="results"] #results { display: block; }
  nav.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--panel); padding-bottom: env(safe-area-inset-bottom, 0px); }
  nav.tabs button { padding: 10px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
  nav.tabs button[aria-selected="true"] { color: var(--steel); box-shadow: inset 0 -2px 0 var(--steel); }
  .hero .big { font-size: 38px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Shop capacity — one core</h1>
    <div class="g">Shifts <span class="step"><button data-g="shifts" data-d="-1" aria-label="Fewer shifts">−</button><input id="shifts" type="number" min="1" max="4" step="1" value="1"><button data-g="shifts" data-d="1" aria-label="More shifts">+</button></span></div>
    <div class="g">of <input id="shiftHours" class="num w3" type="number" min="1" max="24" step="0.5" value="10"> hours</div>
    <div class="g">Shift rule <span class="seg"><button id="modeCont" aria-pressed="true" title="Ops carry over the shift boundary with no penalty">Continuous</button><button id="modeDisc" aria-pressed="false" title="Only whole ops that fit inside a shift count">Discrete</button></span></div>
    <div class="spacer"></div>
    <button class="link" id="reset">Reset to starting values</button>
  </header>
  <main data-tab="floor">
    <aside id="controls" aria-label="Setup"></aside>
    <section id="floor" aria-label="Shop floor">
      <canvas id="c3d"></canvas>
      <div id="tip"></div>
      <div class="hint" id="hint">Drag to orbit · scroll to zoom · click a machine to edit</div>
      <div class="legend"><span><i style="background:var(--ok)"></i>running</span><span><i style="background:var(--idle)"></i>no operator</span><span><i style="background:var(--hot)"></i>bottleneck</span><span><i style="background:var(--warn); border-radius:2px"></i>WIP piling up</span></div>
    </section>
    <aside id="results" aria-label="Results"></aside>
  </main>
  <nav class="tabs" aria-label="Sections">
    <button data-tab="setup" aria-selected="false">Setup</button>
    <button data-tab="floor" aria-selected="true">Floor</button>
    <button data-tab="results" aria-selected="false">Results</button>
  </nav>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===================== ENGINE ===================== */
const DEFAULT_STATE = {
  shifts: 1, shiftHours: 10, mode: 'continuous', supervisorRatio: 8,
  pools: {
    hexMill:    { label: 'Hex mills',      kind: 'mill',  staff: 'machinist', machines: 4, staffCount: 4, perStaff: 1, routing: 'flexible', split10: 2, split20: 2 },
    srMill:     { label: 'Reflector mill', kind: 'mill',  staff: 'machinist', machines: 1, staffCount: 1, perStaff: 1, routing: 'flexible', split10: 1, split20: 0 },
    dowelLathe: { label: 'Dowel lathe',    kind: 'lathe', staff: 'machinist', machines: 1, staffCount: 1, perStaff: 1 },
    plugLathe:  { label: 'Plug lathe',     kind: 'lathe', staff: 'machinist', machines: 1, staffCount: 1, perStaff: 1 },
    bandsaw:    { label: 'Bandsaw',        kind: 'saw',   staff: 'machinist', machines: 1, staffCount: 1, perStaff: 1 },
    cmm:        { label: 'CMM',            kind: 'cmm',   staff: 'cmmer',     machines: 2, staffCount: 2, perStaff: 1 },
    dowelGauge: { label: 'Dowel gauge',    kind: 'gauge', staff: 'cmmer',     machines: 1, staffCount: 1, perStaff: 1 },
    plugGauge:  { label: 'Plug gauge',     kind: 'gauge', staff: 'cmmer',     machines: 1, staffCount: 1, perStaff: 1 },
  },
  blocks: {
    hex:   { label: 'Hex block',      qtyPerCore: 850,   pool: 'hexMill',    machining: 'ops',  ops: [{ name: 'Op10', setup: 60, cut: 127 }, { name: 'Op20', setup: 60, cut: 49 }],
             saw: { min: 30, batch: 1 },  inspect: { pool: 'cmm',        setup: 60, run: 120 }, yield: 1, reworkOp: 1 },
    sr:    { label: 'Side reflector', qtyPerCore: 186,   pool: 'srMill',     machining: 'ops',  ops: [{ name: 'Op10', setup: 60, cut: 127 }, { name: 'Op20', setup: 60, cut: 49 }],
             saw: { min: 30, batch: 1 },  inspect: { pool: 'cmm',        setup: 60, run: 120 }, yield: 1, reworkOp: 1 },
    dowel: { label: 'Dowel',          qtyPerCore: 2864,  pool: 'dowelLathe', machining: 'rate', ratePer10hr: 250,
             saw: { min: 5, batch: 250 }, inspect: { pool: 'dowelGauge', setup: 0,  run: 2 },   yield: 1, reworkOp: 0 },
    plug:  { label: 'Plug',           qtyPerCore: 24420, pool: 'plugLathe',  machining: 'rate', ratePer10hr: 460,
             saw: { min: 5, batch: 460 }, inspect: { pool: 'plugGauge',  setup: 0,  run: 2 },   yield: 1, reworkOp: 0 },
  },
};
const BLOCK_ORDER = ['hex', 'sr', 'dowel', 'plug'];
const POOL_ORDER = ['bandsaw', 'hexMill', 'srMill', 'dowelLathe', 'plugLathe', 'cmm', 'dowelGauge', 'plugGauge'];
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function running(pool) { return Math.max(0, Math.min(pool.machines, pool.staffCount * pool.perStaff)); }
function discreteCycleRate(opMins, shiftMin, nShifts = 60) {
  if (!opMins.length || opMins.some(m => m <= 0)) return 0;
  if (opMins.some(m => m > shiftMin)) return 0;
  let idx = 0, done = 0;
  for (let s = 0; s < nShifts; s++) { let t = 0; while (t + opMins[idx] <= shiftMin) { t += opMins[idx]; idx = (idx + 1) % opMins.length; if (idx === 0) done++; } }
  return done / nShifts;
}
function pieceMinutes(block) {
  const y = Math.min(1, Math.max(0.01, block.yield || 1)); const rw = 1 / y;
  const out = { saw: block.saw.min / Math.max(1, block.saw.batch), inspect: (block.inspect.setup + block.inspect.run) * rw };
  if (block.machining === 'ops') {
    out.ops = block.ops.map((op, i) => ({ name: op.name, min: op.setup + op.cut, mult: i >= block.reworkOp ? rw : 1 }));
    out.machTotal = out.ops.reduce((a, o) => a + o.min * o.mult, 0);
  } else { const m = 600 / Math.max(0.0001, block.ratePer10hr); out.ops = [{ name: 'Turn', min: m, mult: rw }]; out.machTotal = m * rw; }
  return out;
}
function compute(state) {
  const shiftMin = state.shiftHours * 60, H = state.shifts * shiftMin, discrete = state.mode === 'discrete';
  const R = {}; for (const k in state.pools) R[k] = running(state.pools[k]);
  const blocks = {};
  for (const key in state.blocks) {
    const b = state.blocks[key], pm = pieceMinutes(b), pool = state.pools[b.pool], run = R[b.pool];
    let machRate = 0, machDetail = '';
    if (run > 0 && pm.machTotal > 0) {
      if (b.machining === 'ops' && pool.routing === 'paired') {
        const n10 = pool.split10, n20 = pool.split20, scale = (n10 + n20) > 0 ? Math.min(1, run / (n10 + n20)) : 0;
        const r10 = n10 * scale, r20 = n20 * scale, o10 = pm.ops[0], o20 = pm.ops[1];
        const rate10 = o10 ? (discrete ? r10 * state.shifts * Math.floor(shiftMin / o10.min) / o10.mult : r10 * H / (o10.min * o10.mult)) : Infinity;
        const rate20 = o20 && o20.min > 0 ? (discrete ? r20 * state.shifts * Math.floor(shiftMin / o20.min) / o20.mult : r20 * H / (o20.min * o20.mult)) : Infinity;
        // ops beyond the second, if any, ride on the op20 machines
        let extra = 0; for (let i = 2; i < pm.ops.length; i++) extra += pm.ops[i].min * pm.ops[i].mult;
        const rate20x = extra > 0 && o20 ? r20 * H / (o20.min * o20.mult + extra) : rate20;
        machRate = Math.min(rate10, rate20x); machDetail = `${r10.toFixed(1)} on ${o10 ? o10.name : 'op10'}, ${r20.toFixed(1)} on ${o20 ? o20.name : 'op20'}`;
      } else if (discrete) {
        const base = discreteCycleRate(pm.ops.map(o => o.min), shiftMin);
        const contY1 = shiftMin / pm.ops.reduce((a, o) => a + o.min, 0);
        const yf = contY1 > 0 ? (shiftMin / pm.machTotal) / contY1 : 1;
        machRate = run * state.shifts * base * yf;
      } else machRate = run * H / pm.machTotal;
    }
    blocks[key] = { key, label: b.label, pm, machRate, machDetail, qty: b.qtyPerCore };
  }
  function usableMinutes(poolKey, demands) {
    const cap = R[poolKey] * H; if (!discrete) return cap;
    const total = demands.reduce((a, d) => a + d.rate * d.min, 0); if (total <= 0) return cap;
    let usable = 0; for (const d of demands) { const w = (d.rate * d.min) / total; const per = d.min > 0 && d.min <= shiftMin ? Math.floor(shiftMin / d.min) * d.min : 0; usable += w * per; }
    return R[poolKey] * state.shifts * usable;
  }
  const stages = {};
  { const demands = Object.values(blocks).map(b => ({ rate: b.machRate, min: b.pm.saw }));
    const cap = usableMinutes('bandsaw', demands), demand = demands.reduce((a, d) => a + d.rate * d.min, 0);
    const f = demand > 0 ? Math.min(1, cap / demand) : 1;
    stages.bandsaw = { demand, cap, factor: f, util: cap > 0 ? Math.min(1, demand / cap) : (demand > 0 ? 1 : 0) };
    for (const b of Object.values(blocks)) { b.sawRate = b.machRate * f; b.millOut = b.sawRate; } }
  for (const k in state.pools) { const p = state.pools[k]; if (p.kind === 'mill' || p.kind === 'lathe') {
    const users = Object.values(blocks).filter(b => state.blocks[b.key].pool === k);
    const demand = users.reduce((a, b) => a + b.millOut * b.pm.machTotal, 0), cap = R[k] * H;
    stages[k] = { demand, cap, factor: 1, util: cap > 0 ? Math.min(1, demand / cap) : (demand > 0 ? 1 : 0) }; } }
  const inspPools = [...new Set(Object.values(state.blocks).map(b => b.inspect.pool))];
  for (const pk of inspPools) {
    const users = Object.values(blocks).filter(b => state.blocks[b.key].inspect.pool === pk);
    const demands = users.map(b => ({ rate: b.millOut, min: b.pm.inspect }));
    const cap = usableMinutes(pk, demands), demand = demands.reduce((a, d) => a + d.rate * d.min, 0);
    const f = demand > 0 ? Math.min(1, cap / demand) : 1;
    stages[pk] = { demand, cap, factor: f, util: cap > 0 ? Math.min(1, demand / cap) : (demand > 0 ? 1 : 0) };
    for (const b of users) { b.final = b.millOut * f; b.wipBeforeInspect = b.millOut - b.final; } }
  let coreDays = 0, bottleneckBlock = null;
  for (const b of Object.values(blocks)) {
    const sb = state.blocks[b.key];
    if (b.final <= 0) { b.limitKey = R[sb.pool] <= 0 ? sb.pool : (R.bandsaw <= 0 ? 'bandsaw' : sb.inspect.pool); b.limit = state.pools[b.limitKey].label + ' idle'; }
